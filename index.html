<style>
:root{--bg:#f5f6f9;--card:#fff;--ink:#0c2233;--mut:#586b7b;--line:#dbe5ee;--acc:#3b4a6b;--accfg:#fff;--sos:#d9482b;--soft:#e4eff6;--warn:#fff3df;color-scheme:light;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09131b;--card:#112230;--ink:#e8f1f7;--mut:#93a8b8;--line:#223646;--acc:#a9bce6;--accfg:#06222e;--sos:#f0694d;--soft:#143041;--warn:#33291a;color-scheme:dark}}

.back{background:none;border:0;color:var(--acc);font-weight:700;padding:8px 0;font-size:15px}

.pr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.pr b{display:block;margin-bottom:2px}
.warn{background:var(--warn);border-radius:12px;padding:14px;margin-bottom:10px}
.my{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}.my summary{font-weight:700;cursor:pointer}.my p{margin:10px 0 0}.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}a{color:var(--acc);font-weight:700}

 한 번에 조금씩 자주 주는 것이 현명하다고 봅니다. 먼저 베풀면 호의가 되고 나중에 베풀면 갚음에 그친다고도 합니다.", "ask": "내가 베푼 것에 기대하는 보답은 무엇인가?"}, {"title": "비밀 없는 사이가 가장 좋은 사이다", "body": "책은 완전한 결합을 추구하는 것이 상처를 주고받을 조건을 만든다고 봅니다. 완전한 신뢰와 완전한 소유는 다르고, 누구에게 무엇을 털어놓을지 구분해야 깊은 신뢰가 생긴다고 합니다.", "ask": "이 이야기를 누구에게 해도 되는가?"}, {"title": "남이 보는 나가 곧 나다", "body": "책은 남의 평가를 거쳐야만 자신을 알 수 있게 된 시대라고 진단합니다. 하지만 나를 아는 일은 가장 어렵고, 큰 인물이 못 되는 ‘이만한 사람’임을 인정할 때 새 가능성이 보인다고 합니다.", "ask": "남의 평가가 없다면 나는 나를 어떻게 설명하는가?"}, {"title": "분노는 참아야 하고, 폭발하면 진다", "body": "책은 화를 내는 것 자체는 창피한 일이 아니라고 봅니다. 문제는 분노를 표현하고도 얻은 것 없이 관계만 잃는 경우입니다. 굳은 의지를 부드러운 말에 담아 전하는 편이 더 강력하다고 봅니다.", "ask": "이 분노로 내가 얻고 싶은 것은 무엇인가?"}], "gains": [{"title": "덜 지치는 관계", "body": "모두에게 좋은 사람이 되려는 노력을 내려놓으면 눈치 보느라 쓰던 에너지가 줄어든다고 책은 봅니다.", "line": "퇴근길에 에너지가 남아 있다."}, {"title": "나를 지키는 거리", "body": "너무 가깝지도 멀지도 않은 거리에서 상대의 필요와 나의 필요를 조화시킬 수 있게 됩니다.", "line": "부탁을 거절해도 관계가 이어진다."}, {"title": "스스로에게 필요한 사람", "body": "책은 스스로에게, 사랑하는 이에게, 곁의 사람들에게 소중한 사람이 되는 것이 더 큰 사명이라고 말합니다.", "line": "오늘의 나를 인정하며 하루를 닫는다."}, {"title": "기다림이 주는 힘", "body": "기다림은 무위가 아니라 결실을 받아낼 근력을 키우는 시간이라고 책은 봅니다.", "line": "서두르지 않아도 조금씩 나아지고 있다."}], "rules": [{"title": "필요한 사람이 되기", "body": "책은 모든 이에게 쓸모 있으려 하지 말고 ‘고마운 존재’보다 ‘필요한 존재’가 되라고 합니다. 기대는 오래 기억되지만 감사는 금방 사라진다고 봅니다."}, {"title": "일의 세 가지 점검", "body": "내 일을 지키려면 나 자신, 설득 대상, 주고받을 것 세 가지를 챙깁니다. 가장 중요한 것을 파악하고, 상대의 입장을 이해하고, 양보할 것과 챙길 것을 정리합니다."}, {"title": "괜찮은 친구 가리기", "body": "이익, 자기의 비중, 양심 세 가지로 친구를 살핍니다. 괜찮은 친구는 어울리는 즐거움을 추구하고, 다른 이의 말을 들으며, 잘못을 사과합니다."}, {"title": "화낼 준비", "body": "감정을 냉정의 그릇에 담습니다. 공격은 잘못을, 모욕은 사람을 향합니다. 한 템포 쉬고, 따로 불러, 전할 메시지 중심으로 말하며, 말은 반의 반으로 줄입니다."}, {"title": "나를 숨기는 지혜", "body": "능력은 적당히 보이고 약점은 드러내지 않습니다. 계획은 완성 전에 알리지 않고, 성과는 뽐내지 않으며, 공은 나눕니다. 다만 이것은 보호색이지 거짓이 아닙니다."}, {"title": "기다림과 절제", "body": "갈등이 크면 휘젓지 말고 기다립니다. 눈덩이를 굴리지 않고, 남 탓 대신 내 책임을 지며, 작은 성취를 꿰어 만족을 쌓습니다."}, {"title": "질투를 순환 에너지로", "body": "질투와 열등감을 부끄러워하지 않고 향상심으로 돌립니다. 누군가 자랑하면 시기 대신 유쾌하게 ‘밥 사’라고 말합니다."}, {"title": "여유와 플랜B", "body": "최선만 보지 말고 차선과 플랜B를 미리 마련합니다. 필요한 수단은 두 가지씩 준비하고, 일이 막히면 여러 사람의 안목을 빌립니다."}, {"title": "신뢰의 한계", "body": "신뢰는 상대에게 권리를 주는 일이므로 선을 두어 지킵니다. 털어놓을 것과 감출 것을 구분하고, 다른 사람이 나를 보는 관점도 존중합니다."}, {"title": "인생의 세 막", "body": "1막은 고전과 대화하고, 2막은 살아 있는 사람들과 어울리며, 3막은 오로지 나를 위해 보낸다고 책은 소개합니다."}], "stories": [{"title": "12년을 기다린 첼리스트", "body": "한 첼리스트는 열세 살에 헌책방에서 악보를 발견하고도 12년 뒤 스물다섯에야 완전한 형태로 연주했습니다. 96세까지 매일 연습했고, 95세에 하루 여섯 시간 연습하는 이유를 묻자 조금씩 나아지기 때문이라고 답했다고 합니다.", "line": "기다림은 준비의 다른 이름이다."}, {"title": "가젤과 사자", "body": "굶주린 가젤 무리가 호숫가에서 배를 채우다 멀리서 지켜보던 사자에게 습격받습니다. 책은 배가 덜 찼다 싶을 때 떠나야 하며, 성공 뒤의 방심이 가장 위험하다고 봅니다.", "line": "절정에서 경계를 풀지 않는다."}, {"title": "눈덩이처럼 커진 스트레스", "body": "사소한 지적에 핑계를 댄 직장인의 스트레스가 10에서 30, 70, 150, 300으로 불어납니다. 책은 선배가 키운 것보다 스스로 증폭한 부분이 더 크다고 봅니다.", "line": "눈덩이는 내가 굴릴 때만 커진다."}, {"title": "좋은 사람의 덫에 걸린 선배", "body": "부지런했지만 부탁을 거절하지 못하던 선배는 이용당하는 줄 알면서도 칭찬에 미련을 두었습니다. 책은 이를 ‘좋은 사람의 덫’이라 봅니다.", "line": "칭찬이 족쇄가 될 수 있다."}, {"title": "후배에게 퍼부은 분노", "body": "책의 필자는 후배에게 심한 말을 쏟아내 사이가 나빠지고 오래 후회했다고 돌아봅니다. 한 템포 쉬고 따로 불러 메시지 중심으로 말했어야 했다고 정리합니다.", "line": "공격은 하되 모욕은 하지 않는다."}, {"title": "고추밭에 들어가지 않기", "body": "책은 고추가 스스로를 지키려고 매운 성분을 만든다고 비유합니다. 좋은 사람으로 인정받으려고 남의 영역에 함부로 들어가지 말고, 상대가 길을 내줄 때까지 참을성 있게 기다리라고 합니다.", "line": "관계에도 길들이는 시간이 필요하다."}, {"title": "어린 왕자와 여우", "body": "책은 ‘길들인다’를 관계를 맺는 일로 풀이합니다. 오랜 정성과 참을성이 있어야 서로에게 하나밖에 없는 존재가 되며, 한쪽이 일방적으로 길들이는 것이 아니라고 합니다.", "line": "서로 길들이며 필요한 사이가 된다."}, {"title": "아버지의 한결같음", "body": "필자는 어릴 때 평범해 보이던 아버지가, 스스로 부모가 된 뒤 한결같이 자기 길을 걸어온 위대한 사람으로 보였다고 돌아봅니다.", "line": "평범함 속에 한결같음이 있다."}], "checklist": ["지금 하려는 말은 반으로 줄일 수 있는가", "이 말은 행동을 향하는가, 사람을 향하는가", "지금 나는 인정받고 싶어서 대답하는가", "이 일을 해도 내 필요는 지켜지는가", "이 이야기를 이 사람에게 해도 되는가", "내가 드러내려는 약점은 꼭 필요한가", "하룻밤 지난 뒤에 말해도 늦지 않은가"], "logEnabled": true, "help": {"disclaimer": "이 앱은 책의 관점을 정리한 것이며 전문 상담, 의료, 법률 조언이 아닙니다.", "signalsTitle": "이런 경우에는 전문가를 만나세요", "signals": ["폭력, 협박, 스토킹, 심한 통제가 있을 때", "직장에서 괴롭힘이 반복될 때", "우울감, 불면, 불안이 2주 이상 이어질 때", "스스로를 해치고 싶다는 생각이 들 때"], "contactsTitle": "연락처 sprout:'<path d="M12 22v-9M12 13c0-4 3-6 7-6 0 4-3 6-7 6zM12 15c0-3-2-5-6-5 0 3 2 5 6 5z"/>',
star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21.1 7 14.2 2 9.3l6.9-1z"/>',
moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
flag:'<path d="M4 21V4M4 4h12l-2 4 2 4H4"/>',
bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'};
const ic=(k,z=24)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]||IC.shield}</svg>`;
const L=Object.assign({today:"오늘",sos:"지금 대응",learn:"이해",story:"기록",help:"전문 도움",myths:"진실 확인",gains:"얻는 것들",rules:"원칙",dailyLabel:"오늘의 선언",truthHeading:"오늘의 진실",pledgeHeading:"나의 다짐",pledgePlaceholder:"",checklistHeading:"사전 점검",checklistReset:"점검 초기화",sosLabel:"지금 대응",sosTitle:"",sosText:"",sosCta:"",sosFooter:"",back:"‹ 목록",bookHeading:"책의 관점",mindHeading:"마음속 선언",sayHeading:"그 자리에서 할 말",doHeading:"행동 지침",extraTag:"책 밖 조언",mythsTitle:"진실 확인",mythsIntro:"",askPrefix:"스스로에게 묻기: ",gainsTitle:"얻는 것들",gainsIntro:"",rulesTitle:"핵심 원칙",rulesIntro:"",storyTitle:"사례",storyIntro:"",logTitle:"나의 기록",logIntro:"",logPlaceholder:"",logAdd:"기록하기",logDelete:"삭제",logCopy:"전체 복사",logCopied:"복사했습니다",logNote:"기록은 이 기기에만 저장되며 서버로 전송되지 않습니다.",helpTitle:"전문 도움"},C.labels||{});
const A=k=>Array.isArray(C[k])?C[k]:[];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=document.getElementById("app"),nav=document.getElementById("nav");
let tab="today",cur=null,sub=null;
function sg(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const day=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const subs=()=>[["myths",L.myths],["gains",L.gains],["rules",L.rules]].filter(a=>A(a[0]).length);
const tabs=()=>[["today",L.today,"sun"],A("situations").length&&["sos",L.sos,"shield"],subs().length&&["learn",L.learn,"book"],(A("stories").length||C.logEnabled)&&["story",L.story,"note"],C.help&&["help",L.help,"buoy"]].filter(Boolean);
function today(){
 const d=day(),D=A("daily"),M=A("myths"),CK=A("checklist"),ck=JSON.parse(sg("ck","[]")),m=M.length?M[d%M.length]:null;
 return (D.length?`<div class="hero"><div class="lab">${esc(L.dailyLabel)}</div><p class="stmt">${esc(D[d%D.length])}</p></div>`:"")+
 (A("situations").length?`<button class="sit" data-go="sos"><span class="i">${ic("shield")}</span><span><b>${esc(L.sos)}</b><span class="mut">${esc(L.sosCta)}</span></span></button>`:"")+
 (m?`<h2>${esc(L.truthHeading)}</h2><div class="box"><b>${esc(m.title)}</b><p>${esc(m.body)}</p></div>`:"")+
 `<h2>${esc(L.pledgeHeading)}</h2><textarea id="pl" placeholder="${esc(L.pledgePlaceholder)}">${esc(sg("pl",""))}</textarea>`+
 (CK.length?`<h2>${esc(L.checklistHeading)}</h2>`+CK.map((c,n)=>`<label class="c"><input type="checkbox" data-c="${n}" ${ck.includes(n)?"checked":""}><span>${esc(c)}</span></label>`).join("")+`<button class="back" id="rs">${esc(L.checklistReset)}</button>`:"");
}
function sos(){
 const S=A("situations");
 if(cur===null)return `<div class="hero"><div class="lab">${esc(L.sosLabel)}</div><h1>${esc(L.sosTitle)}</h1><p>${esc(L.sosText)}</p></div>`+
  S.map((s,n)=>`<button class="sit" data-n="${n}"><span class="i">${ic(s.icon)}</span><span><b>${esc(s.title)}</b><span class="mut">${esc(s.sub)}</span></span></button>`).join("")+(L.sosFooter?`<p class="mut">${esc(L.sosFooter)}</p>`:"");
 const s=S[cur],say=s.say||[],dos=s.do||[];
 return `<button class="back" id="bk">${esc(L.back)}</button><h1>${esc(s.title)}</h1>`+
 (s.book?`<h2>${esc(L.bookHeading)}</h2><div class="box">${esc(s.book)}</div>`:"")+
 (s.mind?`<h2>${esc(L.mindHeading)}</h2><div class="mind">“${esc(s.mind)}”</div>`:"")+
 (say.length?`<h2>${esc(L.sayHeading)}</h2>`+say.map(x=>`<div class="say">“${esc(x)}”</div>`).join(""):"")+
 (dos.length?`<h2>${esc(L.doHeading)}</h2>${s.extra?`<span class="tag">${esc(L.extraTag)}</span>`:""}<ul class="l">${dos.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"");
}
function myths(){return `<h1>${esc(L.mythsTitle)}</h1><p class="mut">${esc(L.mythsIntro)}</p>`+A("myths").map(m=>`<details class="my"><summary>${esc(m.title)}</summary><p>${esc(m.body)}</p>${m.ask?`<p class="mind" style="font-size:17px">${esc(L.askPrefix)}${esc(m.ask)}</p>`:""}</details>`).join("")}
function gains(){return `<h1>${esc(L.gainsTitle)}</h1><p class="mut">${esc(L.gainsIntro)}</p>`+A("gains").map(g=>`<div class="box"><b>${esc(g.title)}</b><p>${esc(g.body)}</p>${g.line?`<div class="mind" style="font-size:16px;margin:0">“${esc(g.line)}”</div>`:""}</div>`).join("")}
function rules(){return `<h1>${esc(L.rulesTitle)}</h1><p class="mut">${esc(L.rulesIntro)}</p>`+A("rules").map((p,n)=>`<div class="pr"><b>${n+1}. ${esc(p.title)}</b>${esc(p.body)}</div>`).join("")}
function learn(){
 const S=subs();if(!S.some(a=>a[0]===sub))sub=S[0][0];
 return (S.length>1?`<div class="seg">`+S.map(a=>`<button data-s="${a[0]}" aria-pressed="${sub===a[0]}">${esc(a[1])}</button>`).join("")+`</div>`:"")+{myths,gains,rules}[sub]();
}
function story(){
 const log=JSON.parse(sg("log","[]")),E=A("stories");
 return (E.length?`<h1>${esc(L.storyTitle)}</h1><p class="mut">${esc(L.storyIntro)}</p>`+E.map(e=>`<details class="my"><summary>${esc(e.title)}</summary><p>${esc(e.body)}</p>${e.line?`<p class="mind" style="font-size:17px">${esc(e.line)}</p>`:""}</details>`).join(""):"")+
 (C.logEnabled?`<h2>${esc(L.logTitle)}</h2><p class="mut">${esc(L.logIntro)}</p>
 <textarea id="ex" placeholder="${esc(L.logPlaceholder)}"></textarea>
 <button class="sit" id="ad" style="justify-content:center;margin-top:8px"><b>${esc(L.logAdd)}</b></button>`+
 log.map((l,n)=>`<div class="box"><span class="mut">${esc(l.d)}</span><p>${esc(l.t)}</p><button class="back" data-del="${n}">${esc(L.logDelete)}</button></div>`).join("")+
 (log.length?`<button class="back" id="cp">${esc(L.logCopy)}</button>`:"")+`<p class="mut">${esc(L.logNote)}</p>`:"");
}
function help(){
 const H=C.help||{};
 return `<h1>${esc(L.helpTitle)}</h1>`+(H.disclaimer?`<div class="warn"><b>${esc(H.disclaimer)}</b></div>`:"")+
 ((H.signals||[]).length?`<h2>${esc(H.signalsTitle||"")}</h2><ul class="l">${H.signals.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"")+
 ((H.contacts||[]).length?`<h2>${esc(H.contactsTitle||"")}</h2>`+H.contacts.map(c=>`<div class="box">${esc(c.label)} ${c.tel?`<a href="tel:${esc(c.tel)}">${esc(c.value)}</a>`:esc(c.value)}${c.note?`<br><span class="mut">${esc(c.note)}</span>`:""}</div>`).join(""):"")+
 (H.closing?`<p class="mut">${esc(H.closing)}</p>`:"");
}
function go(t){tab=t;cur=null;render();scrollTo(0,0)}
function render(){
 if(!tabs().some(a=>a[0]===tab))tab="today";
 app.innerHTML={today,sos,learn,story,help}[tab]();
 nav.innerHTML=tabs().map(a=>`<button data-t="${a[0]}" aria-current="${tab===a[0]}">${ic(a[2],22)}<span>${esc(a[1])}</span></button>`).join("");
 const q=(s,f)=>app.querySelectorAll(s).forEach(f);
 const bk=document.getElementById("bk");if(bk)bk.onclick=()=>{cur=null;render();scrollTo(0,0)};
 q(".sit[data-n]",b=>b.onclick=()=>{cur=+b.dataset.n;render();scrollTo(0,0)});
 q("[data-go]",b=>b.onclick=()=>go(b.dataset.go));
 nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.t));
 q("[data-s]",b=>b.onclick=()=>{sub=b.dataset.s;render()});
 const pl=document.getElementById("pl");if(pl)pl.oninput=()=>ss("pl",pl.value);
 q("input[data-c]",i=>i.onchange=()=>{ss("ck",JSON.stringify([...app.querySelectorAll("input[data-c]")].filter(x=>x.checked).map(x=>+x.dataset.c)))});
 const rs=document.getElementById("rs");if(rs)rs.onclick=()=>{ss("ck","[]");render()};
 const ad=document.getElementById("ad");if(ad)ad.onclick=()=>{const v=document.getElementById("ex").value.trim();if(!v)return;const l=JSON.parse(sg("log","[]"));l.unshift({d:new Date().toLocaleDateString(document.documentElement.lang||"ko"),t:v});ss("log",JSON.stringify(l));render()};
 q("[data-del]",b=>b.onclick=()=>{const l=JSON.parse(sg("log","[]"));l.splice(+b.dataset.del,1);ss("log",JSON.stringify(l));render()});
 const cp=document.getElementById("cp");if(cp)cp.onclick=()=>{const l=JSON.parse(sg("log","[]"));try{navigator.clipboard.writeText(l.map(x=>x.d+"\n"+x.t).join("\n\n")).then(()=>{cp.textContent=L.logCopied})}catch(e){}};
}
render();
// 서비스 워커 등록 (오프라인 사용). https 또는 localhost에서만 동작합니다.
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
